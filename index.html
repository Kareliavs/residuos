<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Residuos Sólidos Perú — Panel Territorial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0d1512; --panel:#121f1a; --panel-2:#16261f; --ink:#e9efe9; --ink-dim:#9db3a8;
    --line:#24382f; --lime:#a4c96e; --amber:#d9a441; --clay:#b8623f; --accent:#7fb37a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  #app{display:grid; grid-template-rows:auto auto 1fr; height:100vh;}

  header{padding:16px 22px 8px; border-bottom:1px solid var(--line);}
  header h1{margin:0; font-size:19px; font-weight:600;}
  header h1 span{color:var(--lime);}
  header .sub{font-size:12px; color:var(--ink-dim); margin-top:2px;}

  .kpis{display:flex; gap:10px; padding:12px 22px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:130px;}
  .kpi .v{font-size:19px; font-weight:700; color:var(--lime);}
  .kpi .l{font-size:10.5px; color:var(--ink-dim); margin-top:2px;}

  .layout{display:grid; grid-template-columns:1fr 340px; height:100%; overflow:hidden;}
  #map{position:relative; height:100%; background:#0a100d;}
  .leaflet-container{background:#0a100d; font-family:inherit;}
  .leaflet-tile{ filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.95) saturate(0.6); }
  .leaflet-tooltip.district-tt{background:var(--panel); color:var(--ink); border:1px solid var(--line);
    font-size:11px; border-radius:5px;}
  .map-glyph-icon{ pointer-events:none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .map-glyph-icon svg{ overflow:visible; }

  .filters{position:absolute; top:12px; left:12px; z-index:1200; display:flex; gap:8px;}
  select{background:var(--panel); color:var(--ink); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px; font-size:12px; font-family:inherit;}

  .legend{position:absolute; bottom:16px; left:12px; z-index:1200; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:11px; color:var(--ink-dim);}
  .legend .lg-title{color:var(--ink); font-weight:600; margin-bottom:6px; font-size:11.5px;}
  .legend .bar{display:flex; height:10px; border-radius:3px; overflow:hidden; width:220px; margin-bottom:4px;}
  .legend .bar div{flex:1;}
  .legend .ticks{display:flex; justify-content:space-between; width:220px; font-size:9.5px;}
  .legend .dothelp{margin-top:6px; font-size:10px;}

  aside{background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:16px;}
  aside .loc{font-size:17px; font-weight:600; margin:0 0 2px;}
  aside .loc-sub{font-size:11px; color:var(--ink-dim); margin-bottom:14px;}
  aside .placeholder{font-size:12px; color:var(--ink-dim); line-height:1.6; padding:20px 4px;}

  .bar-row{margin-bottom:12px;}
  .bar-row .lbl{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;}
  .bar-row .lbl b{color:var(--ink); font-weight:600;}
  .bar-row .lbl .pct{color:var(--lime); font-variant-numeric:tabular-nums;}
  .bar-track{background:var(--panel-2); border-radius:5px; height:9px; overflow:hidden; border:1px solid var(--line);}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--lime)); border-radius:5px;
    transition:width .5s cubic-bezier(.2,.7,.3,1);}

  .radar-wrap{display:flex; justify-content:center; margin:8px 0 16px;}
  .radar-wrap svg{overflow:visible;}
  .ring{fill:none; stroke:var(--line); stroke-width:1;}
  .axis-line{stroke:#26392f; stroke-width:1;}
  .glyph-poly{fill:rgba(164,201,110,0.18); stroke:var(--lime); stroke-width:1.6;}
  .glyph-dot{fill:var(--lime); stroke:var(--bg); stroke-width:1;}
  .axis-label{font-size:9px; fill:var(--ink-dim); text-anchor:middle;}
  .center-hole{fill:none; stroke:var(--amber); stroke-width:1.2; stroke-dasharray:2 2;}

  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim);
    margin:18px 0 8px; border-top:1px solid var(--line); padding-top:14px;}
  .note{font-size:11px; color:var(--ink-dim); background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; line-height:1.5;}
  .status{position:fixed; bottom:10px; right:14px; font-size:10.5px; color:var(--ink-dim); z-index:2000;}
  .refresh-hint{font-size:10px; color:var(--ink-dim); margin-top:16px; line-height:1.5; border-top:1px solid var(--line); padding-top:10px;}
  code{background:var(--panel-2); padding:1px 4px; border-radius:3px; font-size:10px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Residuos Sólidos · <span>Perú</span></h1>
    <div class="sub">Generación per cápita distrital (MINAM-DGRS) — clic en un distrito para ver el detalle</div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="layout">
    <div id="map">
      <div class="filters">
        <select id="deptSelect"><option value="">Todo el país</option></select>
        <select id="metricSelect">
          <option value="gm">GPC municipal (kg/hab/día)</option>
          <option value="gd">GPC doméstico (kg/hab/día)</option>
          <option value="idh">IDH 2019</option>
          <option value="pob">Pobreza total (%)</option>
        </select>
      </div>
      <div class="legend" id="legendBox">
        <div class="lg-title" id="legendTitle">Color de los puntos</div>
        <div class="bar" id="legendBar"></div>
        <div class="ticks" id="legendTicks"></div>
        <div class="dothelp">Tamaño del punto = población del distrito</div>
      </div>
    </div>
    <aside id="sidebar">
      <div class="placeholder" id="sidebarContent">Cargando datos…</div>
    </aside>
  </div>
</div>
<div class="status" id="status"></div>

<script>
const FILES = {
  gpc19: "gpc_2019.csv",
  gpc22: "gpc_2022_no_domiciliario.csv",
  geo: "ubigeo_geo.csv"
};

function loadCsv(url){
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
      complete: (res) => resolve(res.data),
      error: (err) => reject(err)
    });
  });
}

const AXES = [
  {key:"gm",  label:"GPC municipal", suffix:" kg/hab/día", digits:2},
  {key:"gd",  label:"GPC doméstico", suffix:" kg/hab/día", digits:2},
  {key:"pu",  label:"% urbano",      suffix:"%", digits:0, pct100:true},
  {key:"idh", label:"IDH 2019",      suffix:"", digits:3},
  {key:"dens",label:"Densidad",      suffix:" hab/km²", digits:1, log:true},
  {key:"pob", label:"Pobreza total", suffix:"%", digits:1},
];

let DATA = [];
let rankers = {};
let NATIONAL = {};

function pad6(v){ return String(v).trim().padStart(6,'0'); }

async function boot(){
  const statusEl = document.getElementById('status');
  try{
    statusEl.textContent = "Cargando gpc_2019.csv…";
    const [gpc19, gpc22, geo] = await Promise.all([
      loadCsv(FILES.gpc19), loadCsv(FILES.gpc22), loadCsv(FILES.geo)
    ]);
    statusEl.textContent = "Uniendo por UBIGEO…";

    const geoMap = {};
    geo.forEach(r => { if(r.UBIGEO!=null) geoMap[pad6(r.UBIGEO)] = r; });
    const g22Map = {};
    gpc22.forEach(r => { if(r.UBIGEO!=null) g22Map[pad6(r.UBIGEO)] = r; });

    DATA = gpc19.map(r => {
      if(r.UBIGEO==null) return null;
      const u = pad6(r.UBIGEO);
      const g = geoMap[u];
      const g2 = g22Map[u];
      if(!g || g.latitude==null || g.longitude==null) return null;
      const pt = Number(r.POB_TOTAL), pu = Number(r.POB_URBANA);
      return {
        u, d: r.DISTRITO, p: r.PROVINCIA, dp: r.DEPARTAMENTO, tm: r.TIPO_MUNI, rn: r.REGION_NATURAL,
        la: Number(g.latitude), lo: Number(g.longitude),
        pt, pu: (pt? pu/pt : null),
        gd: Number(r.GPC_DOM), gm: Number(r.GPC_MUN),
        idh: g.idh_2019!=null? Number(g.idh_2019): null,
        pob: g.pct_pobreza_total!=null? Number(g.pct_pobreza_total): null,
        dens: g.pob_densidad_2020!=null? Number(g.pob_densidad_2020): null,
        gen_no_dom_2022: g2? Number(g2.GENERACION_NO_DOM_T_DIA_2022) : null,
        pob_2022: g2? Number(g2.POB_TOTAL_2022) : null,
      };
    }).filter(d => d && !isNaN(d.gm) && !isNaN(d.gd));

    statusEl.textContent = DATA.length + " distritos cargados";
    setTimeout(()=> statusEl.textContent = "", 2500);

    buildRankers();
    renderKpis();
    initMap();
    renderSidebar(null);
    renderLegend();
  } catch(e){
    statusEl.textContent = "Error cargando CSV — revisa que los 3 archivos estén junto al HTML y que lo abras vía servidor local (no doble clic).";
    console.error(e);
  }
}

function buildRankers(){
  AXES.forEach(a=>{
    const vals = DATA.map(d=>d[a.key]).filter(v=>v!=null && !isNaN(v));
    const xf = a.log ? vals.map(v=>Math.log10(Math.max(v,0.01))) : vals;
    const sorted = [...xf].sort((x,y)=>x-y);
    rankers[a.key] = (v)=>{
      if(v==null||isNaN(v)) return null;
      const x = a.log ? Math.log10(Math.max(v,0.01)) : v;
      let lo=0, hi=sorted.length;
      while(lo<hi){ const mid=(lo+hi)>>1; if(sorted[mid]<x) lo=mid+1; else hi=mid; }
      return lo/sorted.length;
    };
    const s2 = [...vals].sort((x,y)=>x-y);
    NATIONAL[a.key] = s2[Math.floor(s2.length/2)];
  });
}

function renderKpis(){
  const el = document.getElementById('kpis');
  const totalPob = DATA.reduce((s,d)=>s+(d.pt||0),0);
  const avgGm = DATA.reduce((s,d)=>s+d.gm,0)/DATA.length;
  const withGen22 = DATA.filter(d=>d.gen_no_dom_2022!=null && !isNaN(d.gen_no_dom_2022));
  const totalGen22 = withGen22.reduce((s,d)=>s+d.gen_no_dom_2022,0);
  const items = [
    [DATA.length.toLocaleString('es-PE'), "Distritos con dato geolocalizado"],
    [avgGm.toFixed(2)+" kg", "GPC municipal promedio / hab / día"],
    [totalPob.toLocaleString('es-PE'), "Población total (censo distrital)"],
    [totalGen22 ? Math.round(totalGen22).toLocaleString('es-PE')+" t/día" : "s/d",
      "Generación no domiciliaria 2022 (" + withGen22.length + " distritos)"],
  ];
  el.innerHTML = items.map(([v,l])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

/* ---------- map ---------- */
let map, markerLayer, currentMetric="gm", scale, popMax;
const colorRamp = ["#3c6b52","#5f8a5b","#a4c96e","#d9a441","#b8623f"];

function initMap(){
  map = L.map('map', {preferCanvas:true, zoomControl:true, scrollWheelZoom:true}).setView([-9.2,-75.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', subdomains:'abc', maxZoom:18
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  popMax = Math.max(...DATA.map(d=>d.pt||0));
  scale = colorScale(currentMetric);
  drawMarkers();

  const depts = [...new Set(DATA.map(d=>d.dp))].filter(Boolean).sort();
  const deptSel = document.getElementById('deptSelect');
  depts.forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=d; deptSel.appendChild(o); });
  deptSel.addEventListener('change', ()=>{
    const v = deptSel.value;
    if(!v){ map.setView([-9.2,-75.0], 6); return; }
    const sub = DATA.filter(d=>d.dp===v);
    const lats = sub.map(d=>d.la), lons = sub.map(d=>d.lo);
    map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]], {padding:[60,60]});
  });
  document.getElementById('metricSelect').addEventListener('change', (e)=>{
    currentMetric = e.target.value; scale = colorScale(currentMetric); drawMarkers(); renderLegend();
  });
}

function colorScale(metric){
  const vals = DATA.map(d=>d[metric]).filter(v=>v!=null && !isNaN(v)).sort((a,b)=>a-b);
  const qs = [0.2,0.4,0.6,0.8].map(q=>vals[Math.floor(q*vals.length)]);
  return v => { if(v==null||isNaN(v)) return "#3a4a42"; let i=0; while(i<qs.length && v>qs[i]) i++; return colorRamp[i]; };
}
function radiusFor(pt){ return 2.4 + 7*Math.sqrt((pt||0)/popMax); }

let selected = null;
function drawMarkers(){
  markerLayer.clearLayers();
  DATA.forEach(rec=>{
    const m = L.circleMarker([rec.la, rec.lo], {
      radius: radiusFor(rec.pt), color:"#0d1512", weight:0.6,
      fillColor: scale(rec[currentMetric]), fillOpacity:0.85
    });
    m.bindTooltip(rec.d + " — " + rec.dp, {className:'district-tt', direction:'top', offset:[0,-4]});
    m.on('click', ()=> selectDistrict(rec));
    m.addTo(markerLayer);
  });
}

function selectDistrict(rec){
  selected = rec;
  renderSidebar(rec);
  updateMapGlyph(rec);
  map.panTo([rec.la, rec.lo], {animate:true});
}

/* ---------- VisQuill-style glyph anchored ON the map, at the selected point ---------- */
let glyphMarker = null;
function updateMapGlyph(rec){
  if(glyphMarker){ map.removeLayer(glyphMarker); glyphMarker = null; }
  if(!rec) return;
  const size = 150;
  const icon = L.divIcon({
    className: 'map-glyph-icon',
    html: glyphSVGString(rec, size, false),
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
  glyphMarker = L.marker([rec.la, rec.lo], {icon, interactive:false, zIndexOffset:1000}).addTo(map);
}

const metricLabels = {gm:"GPC municipal (kg/hab/día)", gd:"GPC doméstico (kg/hab/día)", idh:"IDH 2019", pob:"Pobreza total (%)"};
function renderLegend(){
  document.getElementById('legendTitle').textContent = "Color de los puntos: " + metricLabels[currentMetric];
  const vals = DATA.map(d=>d[currentMetric]).filter(v=>v!=null && !isNaN(v)).sort((a,b)=>a-b);
  const qs = [0, ...[0.2,0.4,0.6,0.8].map(q=>vals[Math.floor(q*vals.length)]), vals[vals.length-1]];
  document.getElementById('legendBar').innerHTML = colorRamp.map(c=>`<div style="background:${c}"></div>`).join("");
  document.getElementById('legendTicks').innerHTML =
    `<span>${qs[0].toFixed(1)} (bajo)</span><span>${qs[qs.length-1].toFixed(1)} (alto)</span>`;
}

/* ---------- sidebar: bars + radar ---------- */
function fmt(v, a){
  if(v==null||isNaN(v)) return "s/d";
  const val = a.pct100? v*100 : v;
  return val.toFixed(a.digits) + a.suffix;
}

function renderSidebar(rec){
  const box = document.getElementById('sidebarContent');
  const src = rec || NATIONAL;
  let html = "";
  html += `<p class="loc">${rec? rec.d : "Perú — panorama nacional"}</p>`;
  html += `<div class="loc-sub">${rec? (rec.p+", "+rec.dp+" · UBIGEO "+rec.u) : "Mediana nacional de "+DATA.length+" distritos"}</div>`;

  html += `<div class="section-title">Indicadores (percentil nacional)</div>`;
  AXES.forEach(a=>{
    const v = rec ? rec[a.key] : NATIONAL[a.key];
    const frac = rankers[a.key] ? rankers[a.key](v) : null;
    const pctWidth = frac==null ? 0 : Math.round(frac*100);
    html += `<div class="bar-row">
      <div class="lbl"><b>${a.label}</b><span class="pct">${fmt(v,a)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pctWidth}%"></div></div>
    </div>`;
  });

  html += `<div class="section-title">Glifo radial</div>`;
  html += `<div class="radar-wrap" id="glyphContainer"></div>`;
  html += `<div class="note" style="margin-bottom:14px;">Este mismo glifo aparece anclado sobre el punto en el mapa, con el centro hueco para no tapar el pin.</div>`;

  if(rec){
    html += `<div class="section-title">Datos adicionales</div>`;
    html += `<div class="bar-row"><div class="lbl"><b>Población total</b><span class="pct">${rec.pt? rec.pt.toLocaleString('es-PE') : 's/d'}</span></div></div>`;
    html += `<div class="bar-row"><div class="lbl"><b>Generación no domiciliaria 2022</b><span class="pct">${rec.gen_no_dom_2022!=null && !isNaN(rec.gen_no_dom_2022)? rec.gen_no_dom_2022.toFixed(2)+' t/día' : 's/d'}</span></div></div>`;
    html += `<div class="note">La matriz de composición no domiciliaria (comercios, mercados, hoteles, etc.) que enviaste es una plantilla aún sin llenar — no trae porcentajes por distrito todavía. En cuanto la tengas con datos reales de un estudio de caracterización, se puede agregar aquí como barras de composición (orgánicos, papel, plástico, vidrio, metales…).</div>`;
  } else {
    html += `<div class="note">Clic en cualquier punto del mapa para ver el detalle de ese distrito.</div>`;
  }

  html += `<div class="refresh-hint">Los datos se leen de <code>gpc_2019.csv</code>, <code>gpc_2022_no_domiciliario.csv</code> y <code>ubigeo_geo.csv</code> en la misma carpeta. Para actualizar, reemplaza el CSV manteniendo las mismas columnas — no hace falta tocar el HTML.</div>`;

  box.innerHTML = html;
  const cont = document.getElementById('glyphContainer');
  if(cont) cont.innerHTML = glyphSVGString(rec, 230, true);
}

/* Shared glyph builder: returns a full <svg> markup string.
   Used both in the sidebar (larger, with axis labels) and anchored
   on the map at the selected district's lat/lng (smaller, no labels). */
function glyphSVGString(rec, size, showLabels){
  const N = AXES.length;
  const half = size/2;
  const holeR = size*0.075;
  const R = half - size*0.16 - (showLabels? size*0.06 : 0);
  function pt(i, frac){
    const ang = -Math.PI/2 + i*(2*Math.PI/N);
    const r = holeR*1.15 + frac*(R - holeR*1.15);
    return [r*Math.cos(ang), r*Math.sin(ang)];
  }
  const rings = [0.3,0.55,0.8,1].map(f=>
    `<polygon points="${AXES.map((a,i)=>pt(i,f).join(',')).join(' ')}" class="ring"/>`
  ).join('');
  const axesLines = AXES.map((a,i)=>{
    const [x,y] = pt(i,1);
    let lbl = '';
    if(showLabels){
      const [lx,ly] = pt(i,1.2);
      lbl = `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" class="axis-label">${a.label}</text>`;
    }
    return `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="axis-line"/>${lbl}`;
  }).join('');
  const fracs = AXES.map(a=>{
    const v = rec? rec[a.key] : NATIONAL[a.key];
    const f = rankers[a.key] ? rankers[a.key](v) : null;
    return f==null ? 0.03 : Math.max(f, 0.03);
  });
  const poly = `<polygon points="${fracs.map((f,i)=>pt(i,f).join(',')).join(' ')}" class="glyph-poly"/>`;
  const dots = fracs.map((f,i)=>{
    const [x,y] = pt(i,f);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" class="glyph-dot"/>`;
  }).join('');
  // hollow, transparent center so the underlying map pin / focal point stays visible
  const hole = `<circle cx="0" cy="0" r="${holeR.toFixed(1)}" class="center-hole"/>`;
  return `<svg width="${size}" height="${size}" viewBox="${-half} ${-half} ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${rings}${axesLines}${hole}${poly}${dots}</svg>`;
}

boot();
</script>
</body>
</html>
